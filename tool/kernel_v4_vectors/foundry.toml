[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.33"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# The generator builds the whole fixture JSON in one storage string; the
# ticket-06 vectors push the naive concatenation past the default script
# gas/memory caps.
gas_limit = "18446744073709551615"
memory_limit = 268435456

# `kernel` is a gitignored symlink to the workspace `kernel-v4.0` checkout
# (zerodevapp/kernel pinned at tag v4.0), created by generate.sh. The Kernel
# contracts and their vendored dependencies are the oracle for these vectors
# and are deliberately not copied into this repo.
remappings = [
    "@kernel/=kernel/src/",
    "account-abstraction/=kernel/dependencies/eth-infinitism-account-abstraction-0.9.0/contracts/",
    "solady/=kernel/dependencies/solady-0.1.26/src/",
    "@openzeppelin/contracts/=kernel/dependencies/@openzeppelin-contracts-5.4.0/",
]

# generate.sh writes the committed fixture consumed by `dart test`.
fs_permissions = [{ access = "read-write", path = "../../packages/permissionless/test/fixtures" }]
